presets:
  - name: "Quality Compounder"
    description: "High capital return, low debt, and positive free cash flow compounders"
    handle_financials_de: true
    handle_zero_debt_icr: true
    sort_by: "composite_score"
    ascending: false
    criteria:
      - metric_name: "return_on_equity_pct"
        operator: ">="
        value: 15.0
        description: "ROE >= 15%"
      - metric_name: "roce_pct"
        operator: ">="
        value: 15.0
        description: "ROCE >= 15%"
      - metric_name: "debt_to_equity"
        operator: "<="
        value: 0.5
        description: "D/E <= 0.5"
      - metric_name: "free_cash_flow_cr"
        operator: ">"
        value: 0.0
        description: "FCF > 0 Cr"
      - metric_name: "revenue_cagr_5yr"
        operator: ">="
        value: 8.0
        description: "Revenue CAGR 5Yr >= 8%"

  - name: "Value Pick"
    description: "Low leverage, healthy profit margin, and positive free cash flow value candidates"
    handle_financials_de: true
    handle_zero_debt_icr: true
    sort_by: "composite_score"
    ascending: false
    criteria:
      - metric_name: "debt_to_equity"
        operator: "<="
        value: 1.0
        description: "D/E <= 1.0"
      - metric_name: "return_on_equity_pct"
        operator: ">="
        value: 12.0
        description: "ROE >= 12%"
      - metric_name: "net_profit_margin_pct"
        operator: ">="
        value: 8.0
        description: "NPM >= 8%"
      - metric_name: "free_cash_flow_cr"
        operator: ">"
        value: 0.0
        description: "FCF > 0 Cr"
      - metric_name: "book_value_per_share"
        operator: ">"
        value: 0.0
        description: "Book Value > 0"

  - name: "Growth Accelerator"
    description: "High top-line & bottom-line compounders with expanding profit margins"
    handle_financials_de: true
    handle_zero_debt_icr: true
    sort_by: "composite_score"
    ascending: false
    criteria:
      - metric_name: "revenue_cagr_5yr"
        operator: ">="
        value: 10.0
        description: "Revenue CAGR 5Yr >= 10%"
      - metric_name: "pat_cagr_5yr"
        operator: ">="
        value: 10.0
        description: "PAT CAGR 5Yr >= 10%"
      - metric_name: "return_on_equity_pct"
        operator: ">="
        value: 14.0
        description: "ROE >= 14%"
      - metric_name: "operating_profit_margin_pct"
        operator: ">="
        value: 10.0
        description: "OPM >= 10%"

  - name: "Dividend Champion"
    description: "High dividend payout ratio backed by positive free cash flow and low debt"
    handle_financials_de: true
    handle_zero_debt_icr: true
    sort_by: "composite_score"
    ascending: false
    criteria:
      - metric_name: "dividend_payout_ratio_pct"
        operator: ">="
        value: 20.0
        description: "Dividend Payout >= 20%"
      - metric_name: "free_cash_flow_cr"
        operator: ">"
        value: 0.0
        description: "FCF > 0 Cr"
      - metric_name: "debt_to_equity"
        operator: "<="
        value: 1.0
        description: "D/E <= 1.0"
      - metric_name: "return_on_equity_pct"
        operator: ">="
        value: 12.0
        description: "ROE >= 12%"

  - name: "Debt-Free Blue Chip"
    description: "Zero/virtually zero debt, robust ROE, and strong free cash flow generation"
    handle_financials_de: true
    handle_zero_debt_icr: true
    sort_by: "composite_score"
    ascending: false
    criteria:
      - metric_name: "debt_to_equity"
        operator: "<="
        value: 0.1
        description: "D/E <= 0.1"
      - metric_name: "return_on_equity_pct"
        operator: ">="
        value: 15.0
        description: "ROE >= 15%"
      - metric_name: "free_cash_flow_cr"
        operator: ">"
        value: 0.0
        description: "FCF > 0 Cr"
      - metric_name: "interest_coverage"
        operator: ">="
        value: 5.0
        description: "ICR >= 5.0"

  - name: "Turnaround Watch"
    description: "Operational recovery candidates with positive cash flows and debt deleveraging"
    handle_financials_de: true
    handle_zero_debt_icr: true
    sort_by: "composite_score"
    ascending: false
    criteria:
      - metric_name: "pat_cagr_5yr"
        operator: ">="
        value: 5.0
        description: "PAT CAGR 5Yr >= 5%"
      - metric_name: "free_cash_flow_cr"
        operator: ">"
        value: 0.0
        description: "FCF > 0 Cr"
      - metric_name: "net_debt_cr"
        operator: "<="
        value: 5000.0
        description: "Net Debt <= 5000 Cr"
      - metric_name: "operating_profit_margin_pct"
        operator: ">="
        value: 8.0
        description: "OPM >= 8%"
