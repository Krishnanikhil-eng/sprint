[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nifty100"
version = "0.1.0"
description = "Nifty 100 Analytics"
dependencies = []

[tool.setuptools]
package-dir = {"" = "."}
packages = ["src", "src.dashboard", "src.dashboard.pages", "src.dashboard.utils", "src.etl", "src.analytics", "src.nlp", "src.reports", "src.api", "src.api.routers"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-v"
